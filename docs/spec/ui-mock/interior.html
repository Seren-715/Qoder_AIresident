<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--wood:#7a4a2a;--wood-l:#a0673f;--paper:#fbf3df;--ink:#4a3020;--ink-s:#7a5c44}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#3b2618;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--ink);display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:url(../../../public/art/room-interior.webp) center/cover;overflow:hidden;box-shadow:0 0 0 6px #5a3820,0 10px 40px rgba(0,0,0,.5);border-radius:10px}
.duck{position:absolute;width:10%;transform:translate(-50%,-85%)}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);border:1.5px solid #8a6a4c;border-radius:14px;padding:.35em .8em;font-size:clamp(10px,1.15vw,14px);white-space:nowrap;box-shadow:0 2px 0 #8a6a4c}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--paper);border-right:1.5px solid #8a6a4c;border-bottom:1.5px solid #8a6a4c;transform:translateX(-50%) rotate(45deg)}
.note{position:absolute;background:var(--paper);border:1.5px solid #c9ab82;border-radius:4px;box-shadow:2px 3px 0 rgba(70,40,20,.25);font-size:clamp(9px,1.05vw,13px)}
.note:before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;border-radius:50%;background:#d9573f;border:1.5px solid #8a3020;transform:translateX(-50%)}
.cal{left:2.2%;top:3.5%;width:19%;padding:.7em .8em .6em;transform:rotate(-2deg)}
.cal .t{font-weight:700;font-size:1.35em;letter-spacing:.02em}
.cal .d{color:var(--ink-s);font-size:.9em;margin-bottom:.35em}
.row{display:flex;align-items:center;gap:.45em;margin:.22em 0}
.row svg{width:1.25em;height:1.25em;flex:none}
.bar{flex:1;height:.55em;border-radius:99px;background:#eadcc0;border:1px solid #c9ab82;overflow:hidden}.bar i{display:block;height:100%}
.btns{position:absolute;right:1.6%;top:3%;display:flex;gap:.6vw}
.wb{width:3.6vw;min-width:30px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--wood-l),var(--wood));border:2px solid #4e2e18;display:grid;place-items:center;color:#fbe9c8;font-weight:700;font-size:clamp(9px,1vw,13px);box-shadow:0 3px 0 #3a2010}
.wb svg{width:55%;height:55%}
.tag{position:absolute;transform:translate(-50%,-100%);background:var(--wood);color:#fbe9c8;border:2px solid #4e2e18;border-radius:6px;padding:.3em .7em;font-size:clamp(9px,1.05vw,13px);white-space:nowrap;box-shadow:0 3px 0 #3a2010}
.glow{position:absolute;border-radius:50%;box-shadow:0 0 0 2px rgba(255,236,170,.9),0 0 24px 8px rgba(255,220,130,.55);pointer-events:none}
.away{left:50%;top:4%;width:30%;padding:.8em 1em .7em;transform:translateX(-50%) rotate(1deg)}
.away b{display:block;margin-bottom:.25em}.away .ok{display:inline-block;margin-top:.45em;padding:.15em .7em;border:1.5px solid #8a6a4c;border-radius:99px;font-size:.9em}
.help{position:absolute;left:1.6%;bottom:3%}
.label{position:absolute;font-size:12px;color:#ffe9a8;font-family:monospace}
</style></head><body>
<div class="stage" id="s">
 <div class="note cal"><div class="t">22:15</div><div class="d">11 月 22 日 · 周日</div>
<div class="row"><svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0z" fill="#e9b949" stroke="#6b4224" stroke-width="1.6"/><path d="M8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4" fill="none" stroke="#6b4224" stroke-width="1.4" stroke-linecap="round"/></svg><div class="bar"><i style="width:68%;background:#e9b949"></i></div></div>
<div class="row"><svg viewBox="0 0 24 24"><path d="M16 3a8 8 0 1 0 5 13A9 9 0 0 1 16 3z" fill="#8fc79a" stroke="#4d6b48" stroke-width="1.6"/></svg><div class="bar"><i style="width:62%;background:#8fc79a"></i></div></div>
<div class="row"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="#e89ab0" stroke="#8a3d52" stroke-width="1.6"/></svg><div class="bar"><i style="width:80%;background:#e89ab0"></i></div></div></div><div class="btns"><div class="wb" title="快进">×60</div><div class="wb"><svg viewBox="0 0 24 24" fill="none" stroke="#fbe9c8" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></div></div><div class="wb help" style="position:absolute">?</div>

<div class="bubble" style="left:48%;top:44%">在电脑前写代码</div>
<div class="glow" style="left:2.5%;top:38%;width:15%;height:30%;border-radius:18px"></div>

</div></body></html>
