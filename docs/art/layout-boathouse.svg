<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" font-family="WenQuanYi Zen Hei, PingFang SC, Microsoft YaHei, sans-serif">
  <!-- 小黄鸭船屋 · 布局线框图（9:16）。只表示位置关系，不是美术稿。 -->
  <defs>
    <pattern id="water" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q10 2 20 10 T40 10" fill="none" stroke="#7fa7b8" stroke-width="2"/>
    </pattern>
    <pattern id="plank" width="900" height="36" patternUnits="userSpaceOnUse">
      <line x1="0" y1="35" x2="900" y2="35" stroke="#d9c6a5" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 底色：后墙 + 木地板 -->
  <rect width="900" height="1600" fill="#e9e1d3"/>
  <rect x="0" y="880" width="900" height="720" fill="#efe2c8"/>
  <rect x="0" y="880" width="900" height="720" fill="url(#plank)"/>
  <!-- 斜屋顶梁 -->
  <path d="M0 140 L450 20 L900 140" fill="none" stroke="#8a6a4a" stroke-width="14"/>
  <path d="M0 170 L450 50 L900 170" fill="none" stroke="#b08c66" stroke-width="6"/>

  <!-- 阁楼 -->
  <rect x="30" y="200" width="560" height="320" rx="10" fill="#d8bf98" stroke="#6b4f35" stroke-width="4"/>
  <rect x="30" y="500" width="560" height="34" fill="#b08c66" stroke="#6b4f35" stroke-width="4"/>
  <text x="60" y="240" font-size="26" fill="#6b4f35">阁楼</text>
  <rect x="120" y="270" width="320" height="170" rx="18" fill="#a9c2d6" stroke="#6b4f35" stroke-width="4"/>
  <text x="200" y="365" font-size="34" fill="#3d4f5e">床</text>

  <!-- 梯子 -->
  <rect x="470" y="520" width="80" height="330" fill="none" stroke="#6b4f35" stroke-width="6"/>
  <g stroke="#6b4f35" stroke-width="5">
    <line x1="470" y1="580" x2="550" y2="580"/><line x1="470" y1="640" x2="550" y2="640"/>
    <line x1="470" y1="700" x2="550" y2="700"/><line x1="470" y1="760" x2="550" y2="760"/>
    <line x1="470" y1="820" x2="550" y2="820"/>
  </g>
  <text x="472" y="890" font-size="22" fill="#6b4f35">梯子</text>

  <!-- 记忆墙 -->
  <rect x="620" y="190" width="250" height="300" rx="8" fill="#f6efe2" stroke="#6b4f35" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M630 240 Q745 280 860 240" fill="none" stroke="#8a6a4a" stroke-width="3"/>
  <path d="M630 350 Q745 390 860 350" fill="none" stroke="#8a6a4a" stroke-width="3"/>
  <g fill="#fff" stroke="#6b4f35" stroke-width="2">
    <rect x="650" y="252" width="50" height="40"/><rect x="725" y="262" width="50" height="40"/><rect x="800" y="252" width="50" height="40"/>
    <rect x="660" y="362" width="50" height="40"/><rect x="760" y="372" width="50" height="40"/>
  </g>
  <text x="640" y="465" font-size="24" fill="#6b4f35">记忆墙（Memory）</text>

  <!-- 书架 -->
  <rect x="30" y="570" width="170" height="320" rx="6" fill="#c9a77f" stroke="#6b4f35" stroke-width="4"/>
  <g stroke="#6b4f35" stroke-width="3"><line x1="30" y1="650" x2="200" y2="650"/><line x1="30" y1="730" x2="200" y2="730"/><line x1="30" y1="810" x2="200" y2="810"/></g>
  <text x="45" y="930" font-size="24" fill="#6b4f35">书架（Wiki）</text>

  <!-- 圆窗 + 书桌 -->
  <circle cx="335" cy="625" r="60" fill="#cfe3ea" stroke="#6b4f35" stroke-width="5"/>
  <text x="300" y="633" font-size="22" fill="#4b6b78">圆窗</text>
  <rect x="230" y="720" width="220" height="120" rx="8" fill="#c9a77f" stroke="#6b4f35" stroke-width="4"/>
  <rect x="300" y="690" width="80" height="50" rx="4" fill="#5c5c5c" stroke="#333" stroke-width="3"/>
  <text x="245" y="815" font-size="24" fill="#6b4f35">书桌 + 小电脑</text>

  <!-- 任务公告板 + 门 -->
  <rect x="620" y="560" width="240" height="190" rx="8" fill="#d8b98e" stroke="#6b4f35" stroke-width="4"/>
  <g fill="#fffaf0" stroke="#6b4f35" stroke-width="2"><rect x="640" y="585" width="60" height="50"/><rect x="720" y="595" width="60" height="50"/><rect x="790" y="580" width="55" height="45"/></g>
  <text x="635" y="720" font-size="22" fill="#6b4f35">任务公告板（Quest）</text>
  <rect x="680" y="960" width="190" height="320" rx="80" fill="#a8835c" stroke="#6b4f35" stroke-width="5"/>
  <text x="725" y="1110" font-size="30" fill="#fff">门</text>
  <text x="690" y="1150" font-size="20" fill="#fff">→ 小码头</text>
  <text x="690" y="1180" font-size="20" fill="#fff">（出门旅行）</text>

  <!-- 地毯 -->
  <ellipse cx="460" cy="1060" rx="170" ry="95" fill="#e7b85c" stroke="#6b4f35" stroke-width="4"/>
  <text x="432" y="1125" font-size="28" fill="#6b4f35">地毯</text>

  <!-- 水口（地板上的开口，直通池塘） -->
  <ellipse cx="170" cy="1200" rx="140" ry="85" fill="#a9cbd6" stroke="#6b4f35" stroke-width="5"/>
  <ellipse cx="170" cy="1200" rx="140" ry="85" fill="url(#water)"/>
  <text x="78" y="1255" font-size="26" fill="#2f5664">水口（通池塘）</text>
  <!-- 饭碗 -->
  <ellipse cx="380" cy="1290" rx="48" ry="26" fill="#fff" stroke="#6b4f35" stroke-width="4"/>
  <text x="350" y="1340" font-size="22" fill="#6b4f35">饭碗</text>

  <!-- 前景：栏杆、芦苇盆栽 -->
  <rect x="0" y="1430" width="900" height="170" fill="#d9c6a5" opacity="0.6"/>
  <g stroke="#8a6a4a" stroke-width="8"><line x1="330" y1="1420" x2="330" y2="1600"/><line x1="450" y1="1420" x2="450" y2="1600"/><line x1="570" y1="1420" x2="570" y2="1600"/></g>
  <line x1="310" y1="1440" x2="590" y2="1440" stroke="#8a6a4a" stroke-width="10"/>
  <text x="20" y="1470" font-size="22" fill="#6b4f35">前景：栏杆、芦苇盆栽</text>

  <!-- 界面预留区 -->
  <g fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6">
    <rect x="16" y="16" width="330" height="100" rx="12"/>
    <rect x="770" y="16" width="114" height="100" rx="12"/>
    <rect x="16" y="1490" width="250" height="94" rx="12"/>
    <rect x="700" y="1400" width="184" height="184" rx="12"/>
  </g>
  <g font-size="20" fill="#c0392b">
    <text x="30" y="75">界面：状态条</text>
    <text x="782" y="75">菜单</text>
    <text x="30" y="1545">界面：快进 / 日记</text>
    <text x="712" y="1495">界面：投喂</text>
    <text x="712" y="1525">摸摸 / 聊天</text>
  </g>

  <!-- 鸭子锚点 -->
  <g font-size="22" font-weight="bold">
    <circle cx="280" cy="330" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="272" y="338" fill="#6b4f35">1</text>
    <circle cx="340" cy="870" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="332" y="878" fill="#6b4f35">2</text>
    <circle cx="460" cy="1030" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="452" y="1038" fill="#6b4f35">3</text>
    <circle cx="300" cy="1150" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="292" y="1158" fill="#6b4f35">4</text>
    <circle cx="170" cy="1170" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="162" y="1178" fill="#6b4f35">5</text>
    <circle cx="450" cy="1280" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="442" y="1288" fill="#6b4f35">6</text>
  </g>
</svg>
