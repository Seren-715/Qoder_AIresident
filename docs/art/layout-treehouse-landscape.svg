<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="WenQuanYi Zen Hei, PingFang SC, Microsoft YaHei, sans-serif">
  <!-- 树洞小屋 · 横版布局线框图（16:9）。只表示位置关系，不是美术稿。 -->
  <defs>
    <pattern id="water" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q10 2 20 10 T40 10" fill="none" stroke="#7fa7b8" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- 树洞外壳与内壁 -->
  <rect width="1600" height="900" fill="#8a6446"/>
  <path d="M40 900 L40 220 Q60 40 400 30 L1200 30 Q1560 40 1570 260 L1570 900 Z" fill="#c79b70" stroke="#5a4632" stroke-width="6"/>
  <!-- 地面 -->
  <path d="M40 900 L40 600 Q800 540 1570 600 L1570 900 Z" fill="#b98c62" stroke="#5a4632" stroke-width="4"/>
  <text x="420" y="70" font-size="22" fill="#5a4632">弧形木头内壁（能看到年轮）</text>

  <!-- 阁楼 -->
  <path d="M60 380 L600 380 L600 410 L60 410 Z" fill="#a77b52" stroke="#5a4632" stroke-width="4"/>
  <rect x="60" y="150" width="540" height="230" fill="#d7b48c" opacity="0.5"/>
  <g stroke="#5a4632" stroke-width="4"><line x1="80" y1="340" x2="80" y2="380"/><line x1="200" y1="340" x2="200" y2="380"/><line x1="320" y1="340" x2="320" y2="380"/><line x1="80" y1="340" x2="460" y2="340"/></g>
  <text x="70" y="145" font-size="24" fill="#5a4632">阁楼（带矮栏杆）</text>
  <rect x="150" y="190" width="290" height="130" rx="16" fill="#9bb3c4" stroke="#5a4632" stroke-width="4"/>
  <text x="220" y="265" font-size="30" fill="#33414c">床</text>

  <!-- 绳梯（从阁楼开口垂到地面） -->
  <g stroke="#5a4632" stroke-width="5">
    <line x1="510" y1="410" x2="510" y2="640"/><line x1="565" y1="410" x2="565" y2="640"/>
    <line x1="510" y1="450" x2="565" y2="450"/><line x1="510" y1="500" x2="565" y2="500"/>
    <line x1="510" y1="550" x2="565" y2="550"/><line x1="510" y1="600" x2="565" y2="600"/>
  </g>
  <text x="472" y="672" font-size="20" fill="#5a4632">绳梯</text>

  <!-- 书架（阁楼下方的壁龛） -->
  <path d="M70 430 L270 430 L270 640 L70 640 Z" fill="#a77b52" stroke="#5a4632" stroke-width="4"/>
  <g stroke="#5a4632" stroke-width="3"><line x1="70" y1="500" x2="270" y2="500"/><line x1="70" y1="570" x2="270" y2="570"/></g>
  <text x="90" y="625" font-size="22" fill="#f3e6d3">书架（Wiki）</text>

  <!-- 上方：树洞向上收窄，只放装饰 -->
  <path d="M640 330 Q700 120 900 90 Q1100 120 1160 330" fill="none" stroke="#5a4632" stroke-width="4" stroke-dasharray="12 8"/>
  <line x1="900" y1="90" x2="900" y2="190" stroke="#5a4632" stroke-width="3"/>
  <rect x="880" y="190" width="40" height="50" rx="8" fill="#f2c46b" stroke="#5a4632" stroke-width="3"/>
  <g stroke="#5a4632" stroke-width="3"><line x1="780" y1="110" x2="780" y2="170"/><line x1="1020" y1="110" x2="1020" y2="170"/></g>
  <g fill="#9bb07a" stroke="#5a4632" stroke-width="2"><ellipse cx="780" cy="180" rx="16" ry="22"/><ellipse cx="1020" cy="180" rx="16" ry="22"/></g>
  <text x="700" y="290" font-size="20" fill="#5a4632">上方：树洞向上收窄，挂提灯和干草药（纯装饰）</text>

  <!-- 树节孔窗：移到阁楼床边 -->
  <circle cx="520" cy="240" r="52" fill="#cfe3ea" stroke="#5a4632" stroke-width="6"/>
  <text x="482" y="246" font-size="18" fill="#4b6b78">树节孔窗</text>
  <text x="478" y="318" font-size="16" fill="#5a4632">（在床边）</text>

  <!-- 书桌：电脑屏幕朝墙，凳子朝镜头 -->
  <rect x="620" y="440" width="260" height="110" rx="10" fill="#a77b52" stroke="#5a4632" stroke-width="4"/>
  <path d="M705 400 L795 400 L785 445 L715 445 Z" fill="#6d6d6d" stroke="#333" stroke-width="3"/>
  <text x="634" y="530" font-size="20" fill="#f3e6d3">树墩书桌 · 电脑屏幕朝墙</text>
  <rect x="710" y="575" width="80" height="40" rx="8" fill="#c99a6c" stroke="#5a4632" stroke-width="3"/>
  <text x="702" y="640" font-size="18" fill="#5a4632">小凳（鸭子背对镜头）</text>

  <!-- 旅行角：任务公告板 + 记忆墙，都在鸭子够得着的高度 -->
  <rect x="940" y="400" width="170" height="150" rx="8" fill="#d8b98e" stroke="#5a4632" stroke-width="4"/>
  <g fill="#fffaf0" stroke="#5a4632" stroke-width="2"><rect x="955" y="415" width="44" height="38"/><rect x="1010" y="422" width="44" height="38"/><rect x="1060" y="415" width="38" height="34"/></g>
  <text x="950" y="500" font-size="18" fill="#5a4632">任务公告板</text>
  <text x="950" y="525" font-size="18" fill="#5a4632">（Quest）</text>
  <rect x="1130" y="380" width="230" height="190" rx="8" fill="#ead7bd" stroke="#5a4632" stroke-width="3" stroke-dasharray="10 6"/>
  <path d="M1140 410 Q1245 435 1350 410" fill="none" stroke="#5a4632" stroke-width="3"/>
  <path d="M1140 480 Q1245 505 1350 480" fill="none" stroke="#5a4632" stroke-width="3"/>
  <g fill="#fff" stroke="#5a4632" stroke-width="2"><rect x="1155" y="418" width="40" height="34"/><rect x="1215" y="424" width="40" height="34"/><rect x="1280" y="418" width="40" height="34"/><rect x="1180" y="490" width="40" height="34"/></g>
  <text x="1140" y="555" font-size="18" fill="#5a4632">记忆墙（Memory）</text>
  <text x="940" y="370" font-size="20" fill="#5a4632">旅行角：揭任务 → 出门 → 回来钉明信片</text>

  <!-- 门洞（树根拱门，通池塘和码头） -->
  <path d="M1380 860 L1380 540 Q1475 410 1565 540 L1565 860 Z" fill="#a9cbd6" stroke="#5a4632" stroke-width="8"/>
  <rect x="1395" y="700" width="160" height="40" fill="#a77b52" stroke="#5a4632" stroke-width="3"/>
  <text x="1400" y="610" font-size="22" fill="#2f5664">树根拱门</text>
  <text x="1400" y="640" font-size="18" fill="#2f5664">→ 池塘、码头</text>

  <!-- 地毯 -->
  <ellipse cx="830" cy="730" rx="190" ry="70" fill="#e2c07e" stroke="#5a4632" stroke-width="4"/>
  <text x="800" y="775" font-size="24" fill="#5a4632">地毯</text>

  <!-- 水池（树根之间） + 饭碗 -->
  <path d="M40 900 L40 720 Q160 680 330 720 Q400 760 360 900 Z" fill="#a9cbd6" stroke="#5a4632" stroke-width="5"/>
  <path d="M40 900 L40 720 Q160 680 330 720 Q400 760 360 900 Z" fill="url(#water)"/>
  <text x="90" y="860" font-size="24" fill="#2f5664">水池（树根之间）</text>
  <ellipse cx="470" cy="800" rx="44" ry="22" fill="#fff" stroke="#5a4632" stroke-width="4"/>
  <text x="446" y="845" font-size="20" fill="#5a4632">饭碗</text>

  <!-- 界面预留区 -->
  <g fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6">
    <rect x="16" y="16" width="330" height="90" rx="12"/>
    <rect x="1350" y="16" width="234" height="90" rx="12"/>
    <rect x="560" y="820" width="520" height="66" rx="12"/>
  </g>
  <g font-size="20" fill="#c0392b">
    <text x="30" y="70">界面：名字 / 状态条</text>
    <text x="1362" y="70">界面：快进 / 菜单</text>
    <text x="580" y="860">界面：投喂 · 摸摸 · 聊天 · 日记</text>
  </g>

  <!-- 鸭子锚点 -->
  <g font-size="22" font-weight="bold">
    <circle cx="370" cy="230" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="362" y="238" fill="#5a4632">1</text>
    <circle cx="750" cy="570" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="742" y="578" fill="#5a4632">2</text>
    <circle cx="880" cy="710" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="872" y="718" fill="#5a4632">3</text>
    <circle cx="330" cy="700" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="322" y="708" fill="#5a4632">4</text>
    <circle cx="180" cy="780" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="172" y="788" fill="#5a4632">5</text>
    <circle cx="530" cy="790" r="24" fill="#ffd23f" stroke="#e8772e" stroke-width="5"/><text x="522" y="798" fill="#5a4632">6</text>
  </g>
</svg>
